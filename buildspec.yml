version: 0.2

phases: 
  pre_build:
    commands:
      - echo logging to aws ecr
      - aws --version
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 463556655352.dkr.ecr.ap-southeast-2.amazonaws.com
      - REPOSITORY_URI=463556655352.dkr.ecr.ap-southeast-2.amazonaws.com/django-cicd
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

  build:
    commands:
      - echo starting the build on `date`
      - echo building django application
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo build completed on `date`
      - echo pushing the repo
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      # Give your container name
      - DOCKER_CONTAINER_NAME=spring-demo-ecr
      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo $DOCKER_CONTAINER_NAME
      - echo printing imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
    - target/springboot-aws-deploy.jar
